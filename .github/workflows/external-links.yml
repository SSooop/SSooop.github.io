name: External Link Audit

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-links
  cancel-in-progress: true

jobs:
  external-links:
    name: Weekly external link audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Audit publication URLs
        run: pnpm content:audit:network
        continue-on-error: true

      - name: Audit rendered external links
        run: pnpm links:check:external

      - name: Upload link audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: external-link-report
          path: .reports
          if-no-files-found: ignore
          retention-days: 30

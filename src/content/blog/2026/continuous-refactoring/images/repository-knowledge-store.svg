<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1560" viewBox="0 0 1400 1560" role="img" aria-labelledby="title desc">
  <title id="title">In-repository knowledge store layout</title>
  <desc id="desc">A versioned repository documentation tree with design documents, execution plans, generated references, product specifications, and engineering guide files.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f2ed"/>
      <stop offset="1" stop-color="#e9eef1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#152a3b" flood-opacity=".13"/>
    </filter>
  </defs>
  <rect width="1400" height="1560" rx="42" fill="url(#bg)"/>
  <rect x="72" y="64" width="1256" height="1432" rx="28" fill="#fffdf9" stroke="#cfd8dc" stroke-width="2" filter="url(#shadow)"/>

  <text x="126" y="142" fill="#173047" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="2">IN-REPOSITORY KNOWLEDGE STORE</text>
  <text x="126" y="187" fill="#607487" font-family="Inter, system-ui, sans-serif" font-size="23">Repository as the versioned system of record</text>
  <line x1="126" y1="226" x2="1274" y2="226" stroke="#d9e0e3" stroke-width="2"/>

  <rect x="124" y="266" width="1152" height="1144" rx="18" fill="#f6f7f6" stroke="#dce2e4" stroke-width="2"/>
  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="25" fill="#243847">
    <text x="176" y="323" font-weight="700">AGENTS.md</text>
    <text x="176" y="369" font-weight="700">ARCHITECTURE.md</text>
    <text x="176" y="415" font-weight="700">docs/</text>
    <text x="176" y="461">├── design-docs/</text>
    <text x="226" y="507">│   ├── index.md</text>
    <text x="226" y="553">│   ├── core-beliefs.md</text>
    <text x="226" y="599">│   └── ...</text>
    <text x="176" y="645">├── exec-plans/</text>
    <text x="226" y="691">│   ├── active/</text>
    <text x="226" y="737">│   ├── completed/</text>
    <text x="226" y="783">│   └── tech-debt-tracker.md</text>
    <text x="176" y="829">├── generated/</text>
    <text x="226" y="875">│   └── db-schema.md</text>
    <text x="176" y="921">├── product-specs/</text>
    <text x="226" y="967">│   ├── index.md</text>
    <text x="226" y="1013">│   ├── new-user-onboarding.md</text>
    <text x="226" y="1059">│   └── ...</text>
    <text x="176" y="1105">├── references/</text>
    <text x="226" y="1151">│   ├── design-system-reference-llms.txt</text>
    <text x="226" y="1197">│   ├── nixpacks-llms.txt</text>
    <text x="226" y="1243">│   ├── uv-llms.txt</text>
    <text x="226" y="1289">│   └── ...</text>
    <text x="176" y="1335">├── DESIGN.md</text>
    <text x="176" y="1381">└── SECURITY.md</text>
  </g>

  <rect x="918" y="303" width="300" height="180" rx="18" fill="#e7eef3" stroke="#aec2d0" stroke-width="2"/>
  <text x="952" y="355" fill="#2d617f" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="800" letter-spacing="1.4">THE MAP</text>
  <text x="952" y="398" fill="#405769" font-family="Inter, system-ui, sans-serif" font-size="22">Short instructions</text>
  <text x="952" y="432" fill="#405769" font-family="Inter, system-ui, sans-serif" font-size="22">point to durable,</text>
  <text x="952" y="466" fill="#405769" font-family="Inter, system-ui, sans-serif" font-size="22">versioned knowledge.</text>

  <circle cx="107" cy="323" r="7" fill="#d59b29"/>
  <circle cx="107" cy="369" r="7" fill="#d59b29"/>
  <circle cx="107" cy="415" r="7" fill="#4c8a70"/>
  <text x="126" y="1465" fill="#748591" font-family="Inter, system-ui, sans-serif" font-size="19">Clear hierarchy · reviewable diffs · knowledge that evolves with the code</text>
</svg>

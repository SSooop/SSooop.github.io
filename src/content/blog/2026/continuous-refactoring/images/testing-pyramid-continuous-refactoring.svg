<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Testing pyramid for continuous refactoring</title>
  <desc id="desc">A testing pyramid showing many fast unit tests, focused integration tests, and a small number of broad end-to-end tests.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f6f1"/>
      <stop offset="1" stop-color="#e9eef0"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#173451"/>
      <stop offset="1" stop-color="#2f5d7d"/>
    </linearGradient>
    <linearGradient id="integration" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b34d2b"/>
      <stop offset="1" stop-color="#d86d35"/>
    </linearGradient>
    <linearGradient id="e2e" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d79322"/>
      <stop offset="1" stop-color="#f0b444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="25" flood-color="#162c3f" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#paper)"/>
  <text x="96" y="110" fill="#173047" font-family="Inter, system-ui, sans-serif" font-size="54" font-weight="850">CONTINUOUS REFACTORING</text>
  <text x="98" y="158" fill="#607487" font-family="Inter, system-ui, sans-serif" font-size="25" letter-spacing="2">TESTING PYRAMID · FAST FEEDBACK BY DESIGN</text>
  <line x1="98" y1="198" x2="1502" y2="198" stroke="#cfd9dd" stroke-width="2"/>

  <g filter="url(#shadow)">
    <path d="M796 246 L1016 446 L576 446 Z" fill="url(#e2e)"/>
    <path d="M576 468 L1016 468 L1190 624 L402 624 Z" fill="url(#integration)"/>
    <path d="M402 646 L1190 646 L1360 800 L232 800 Z" fill="url(#unit)"/>
  </g>

  <g fill="#fff" font-family="Inter, system-ui, sans-serif" text-anchor="middle">
    <text x="796" y="342" font-size="31" font-weight="800">END-TO-END</text>
    <text x="796" y="380" font-size="22">few · broad journeys</text>
    <text x="796" y="535" font-size="34" font-weight="800">INTEGRATION TESTS</text>
    <text x="796" y="578" font-size="22">focused boundaries · real contracts</text>
    <text x="796" y="710" font-size="40" font-weight="800">UNIT TESTS</text>
    <text x="796" y="758" font-size="24">many · fast · local feedback</text>
  </g>

  <g font-family="Inter, system-ui, sans-serif">
    <text x="108" y="316" fill="#2f5d7d" font-size="20" font-weight="800" letter-spacing="1">FASTER FEEDBACK</text>
    <path d="M160 354 L160 738" fill="none" stroke="#2f5d7d" stroke-width="5" stroke-linecap="round"/>
    <path d="M160 754 L142 721 L178 721 Z" fill="#2f5d7d"/>
    <text x="1228" y="328" fill="#8c6320" font-size="20" font-weight="800" letter-spacing="1">WIDER SCOPE</text>
    <path d="M1287 722 L1287 360" fill="none" stroke="#8c6320" stroke-width="5" stroke-linecap="round"/>
    <path d="M1287 344 L1269 377 L1305 377 Z" fill="#8c6320"/>
  </g>

  <g font-family="Inter, system-ui, sans-serif" font-size="18" fill="#647684">
    <text x="99" y="852">Small, deterministic checks create the dense feedback loop that makes safe change cumulative.</text>
    <text x="1501" y="852" text-anchor="end">CONCEPT REDRAW · 2026</text>
  </g>
</svg>

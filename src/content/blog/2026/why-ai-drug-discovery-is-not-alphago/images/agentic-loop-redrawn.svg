<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Tool-using agent loop</title>
  <desc id="desc">A prompt enters a repeating loop of gathering context, taking action, and verifying results. The user can interrupt, steer, or add context.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#68726e"/>
    </marker>
    <marker id="arrowWarm" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#bf8e74"/>
    </marker>
    <style>
      .label { font: 600 22px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #26322f; }
      .small { font: 500 18px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6965; }
      .loop { fill: none; stroke: #d8dedb; stroke-width: 2; stroke-dasharray: 8 8; }
      .flow { fill: none; stroke: #68726e; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="420" rx="24" fill="#fbfcfa"/>
  <rect x="270" y="62" width="730" height="230" rx="22" class="loop"/>
  <text x="635" y="92" text-anchor="middle" class="small">agentic loop</text>

  <rect x="38" y="145" width="180" height="78" rx="12" fill="#eceeec"/>
  <text x="128" y="193" text-anchor="middle" class="label">Your prompt</text>

  <rect x="305" y="145" width="190" height="78" rx="12" fill="#dce9df"/>
  <text x="400" y="193" text-anchor="middle" class="label">Gather context</text>

  <rect x="560" y="145" width="180" height="78" rx="12" fill="#d7e5db"/>
  <text x="650" y="193" text-anchor="middle" class="label">Take action</text>

  <rect x="805" y="145" width="190" height="78" rx="12" fill="#dce9df"/>
  <text x="900" y="193" text-anchor="middle" class="label">Verify results</text>

  <rect x="1080" y="152" width="86" height="64" rx="12" fill="#eceeec"/>
  <text x="1123" y="192" text-anchor="middle" class="label">Done</text>

  <path d="M218 184H295" class="flow"/>
  <path d="M495 184H550" class="flow"/>
  <path d="M740 184H795" class="flow"/>
  <path d="M995 184H1070" class="flow"/>
  <path d="M900 224V260Q900 275 885 275H415Q400 275 400 260V233" fill="none" stroke="#9fc8ad" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="38" y="325" width="330" height="62" rx="12" fill="#fff8f3" stroke="#d8a98e" stroke-width="2"/>
  <text x="203" y="350" text-anchor="middle" class="small">You: interrupt, steer,</text>
  <text x="203" y="374" text-anchor="middle" class="small">or add context</text>
  <path d="M368 356H650V235" fill="none" stroke="#bf8e74" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrowWarm)"/>
</svg>

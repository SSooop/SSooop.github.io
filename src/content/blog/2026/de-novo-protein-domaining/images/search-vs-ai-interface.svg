<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Search engine and AI assistant interface comparison</title>
  <desc id="desc">Two familiar search-box interfaces conceal different information models: retrieval above and generative reasoning below.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".24"/>
    </filter>
    <linearGradient id="aiGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f1ef"/>
      <stop offset="1" stop-color="#f5ece6"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="980" fill="#171a1c"/>
  <text x="92" y="78" fill="#f5f2ec" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="4">THE REARVIEW-MIRROR INTERFACE</text>
  <text x="92" y="118" fill="#9aa6aa" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="1">A familiar input box can conceal a different model of knowledge.</text>

  <g filter="url(#shadow)">
    <rect x="92" y="160" width="1216" height="322" rx="26" fill="#fbfaf7"/>
    <rect x="92" y="532" width="1216" height="356" rx="26" fill="url(#aiGlow)"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="138" y="214" fill="#667278" font-size="15" font-weight="700" letter-spacing="2">PAST · SEARCH ENGINE</text>
    <text x="700" y="296" text-anchor="middle" font-size="60" font-weight="700">
      <tspan fill="#3b73d1">S</tspan><tspan fill="#d94c42">e</tspan><tspan fill="#e5ae34">a</tspan><tspan fill="#3b73d1">r</tspan><tspan fill="#4a9a65">c</tspan><tspan fill="#d94c42">h</tspan>
    </text>
    <rect x="386" y="338" width="628" height="58" rx="29" fill="#fff" stroke="#cfd5d6" stroke-width="2"/>
    <circle cx="422" cy="367" r="9" fill="none" stroke="#667278" stroke-width="2"/>
    <path d="m428 373 9 9" stroke="#667278" stroke-width="2.5" stroke-linecap="round"/>
    <text x="457" y="374" fill="#899296" font-size="18">Find pages that contain an answer</text>
    <rect x="535" y="421" width="150" height="34" rx="6" fill="#f0f1f1"/>
    <rect x="700" y="421" width="166" height="34" rx="6" fill="#f0f1f1"/>
    <text x="610" y="443" text-anchor="middle" fill="#596368" font-size="14">SEARCH</text>
    <text x="783" y="443" text-anchor="middle" fill="#596368" font-size="14">FOLLOW A LINK</text>

    <text x="138" y="588" fill="#667278" font-size="15" font-weight="700" letter-spacing="2">PRESENT · AI ASSISTANT</text>
    <circle cx="700" cy="658" r="38" fill="#26383b"/>
    <path d="M682 658c12-24 24-24 36 0-12 24-24 24-36 0Zm18-24v48m-24-24h48" fill="none" stroke="#f6f1e8" stroke-width="3.5" stroke-linecap="round"/>
    <text x="700" y="723" text-anchor="middle" fill="#253337" font-size="30" font-weight="650">Where should we begin?</text>
    <rect x="338" y="760" width="724" height="66" rx="25" fill="#fff" stroke="#c7d1cf" stroke-width="2"/>
    <circle cx="378" cy="793" r="14" fill="#edf1f0"/>
    <path d="M371 793h14m-7-7v14" stroke="#526165" stroke-width="2" stroke-linecap="round"/>
    <text x="414" y="800" fill="#899296" font-size="18">Describe the problem, context, and desired outcome</text>
    <circle cx="1021" cy="793" r="18" fill="#26383b"/>
    <path d="m1013 795 6 6 11-15" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M1165 300v380" stroke="#7f8c8f" stroke-width="2" stroke-dasharray="6 9"/>
    <circle cx="1165" cy="300" r="8" fill="#d94c42"/>
    <circle cx="1165" cy="680" r="8" fill="#4a8879"/>
    <text x="1192" y="293" fill="#697579" font-size="15" font-weight="700">RETRIEVE</text>
    <text x="1192" y="318" fill="#8c9699" font-size="14">Rank existing documents</text>
    <text x="1192" y="673" fill="#416f65" font-size="15" font-weight="700">SYNTHESIZE</text>
    <text x="1192" y="698" fill="#71807c" font-size="14">Construct a response</text>
  </g>

  <text x="92" y="940" fill="#9aa6aa" font-family="Arial, Helvetica, sans-serif" font-size="16">Same visual grammar. Different epistemic machinery.</text>
</svg>

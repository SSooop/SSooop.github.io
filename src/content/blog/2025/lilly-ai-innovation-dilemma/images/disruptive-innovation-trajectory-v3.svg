<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Disruptive innovation performance trajectory</title>
  <desc id="desc">A disruptive technology improves rapidly over time and crosses the performance requirements of progressively more demanding markets.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcff"/>
      <stop offset="1" stop-color="#f3f1ed"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#102a43"/>
      <stop offset="1" stop-color="#ef8354"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#102a43" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" rx="42" fill="url(#paper)"/>
  <circle cx="1430" cy="140" r="250" fill="#dfeaf2" opacity=".46"/>
  <circle cx="180" cy="890" r="300" fill="#f2ddd3" opacity=".38"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="112" y="92" font-size="22" font-weight="700" letter-spacing="4" fill="#60758a">THE INNOVATOR'S DILEMMA</text>
    <text x="112" y="150" font-size="44" font-weight="760" fill="#102a43">Disruptive innovation moves upmarket</text>
    <text x="112" y="190" font-size="21" fill="#60758a">破坏性技术从低端市场切入，并持续跨越更高的性能需求</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="82" y="236" width="1436" height="674" rx="30" fill="#fff" stroke="#dbe2e8" stroke-width="2"/>
  </g>

  <g stroke="#d8e0e7" stroke-width="2">
    <line x1="202" y1="342" x2="202" y2="810"/>
    <line x1="202" y1="810" x2="1402" y2="810"/>
    <line x1="202" y1="694" x2="1402" y2="694" stroke-dasharray="8 12"/>
    <line x1="202" y1="574" x2="1402" y2="574" stroke-dasharray="8 12"/>
    <line x1="202" y1="454" x2="1402" y2="454" stroke-dasharray="8 12"/>
    <line x1="202" y1="334" x2="1402" y2="334" stroke-dasharray="8 12"/>
  </g>

  <g>
    <g color="#d74773" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round">
      <path d="M300 720L1356 612"/>
    </g>
    <path d="M1356 612L1332 602L1335 625Z" fill="#d74773"/>

    <g color="#3f8f74" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round">
      <path d="M300 608L1356 500"/>
    </g>
    <path d="M1356 500L1332 490L1335 513Z" fill="#3f8f74"/>

    <g color="#7f57a5" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round">
      <path d="M300 496L1356 388"/>
    </g>
    <path d="M1356 388L1332 378L1335 401Z" fill="#7f57a5"/>

    <g color="#315a8b" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round">
      <path d="M300 384L1356 276"/>
    </g>
    <path d="M1356 276L1332 266L1335 289Z" fill="#315a8b"/>
  </g>

  <path d="M326 765C510 714 650 630 778 530C924 416 1055 318 1196 258C1260 231 1327 213 1392 196"
        fill="none" stroke="url(#curve)" stroke-width="13" stroke-linecap="round"/>
  <path d="M1392 196L1359 199L1374 226Z" fill="#102a43"/>

  <!-- Labels are rendered above every trajectory with opaque safety panels so
       neither the market lines nor the disruptive curve can obscure the type. -->
  <g font-family="Inter, Arial, sans-serif"
     font-size="21"
     font-weight="650"
     paint-order="stroke fill"
     stroke="#fff"
     stroke-width="6"
     stroke-linejoin="round">
    <rect x="1068" y="605" width="252" height="75" rx="12" fill="#fff" fill-opacity=".96" stroke="none"/>
    <text x="1090" y="642" fill="#b83c63">Low-quality use</text>
    <text x="1090" y="671" fill="#8f99a3" font-size="17" font-weight="500">低端市场需求</text>

    <rect x="1010" y="499" width="310" height="75" rx="12" fill="#fff" fill-opacity=".96" stroke="none"/>
    <text x="1032" y="536" fill="#33765f">Medium-quality use</text>
    <text x="1032" y="565" fill="#8f99a3" font-size="17" font-weight="500">中端市场需求</text>

    <rect x="1020" y="388" width="300" height="75" rx="12" fill="#fff" fill-opacity=".96" stroke="none"/>
    <text x="1042" y="425" fill="#69468a">High-quality use</text>
    <text x="1042" y="454" fill="#8f99a3" font-size="17" font-weight="500">高端市场需求</text>

    <rect x="980" y="279" width="340" height="75" rx="12" fill="#fff" fill-opacity=".96" stroke="none"/>
    <text x="1002" y="316" fill="#294c75">Most demanding use</text>
    <text x="1002" y="345" fill="#8f99a3" font-size="17" font-weight="500">最严苛市场需求</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="535" y="652" width="360" height="84" rx="18" fill="#102a43"/>
    <text x="715" y="686" text-anchor="middle" font-size="24" font-weight="750" fill="#fff">Disruptive technology</text>
    <text x="715" y="715" text-anchor="middle" font-size="17" font-weight="550" fill="#c9d6e2">破坏性技术性能轨迹</text>

    <text x="800" y="875" text-anchor="middle" font-size="25" font-weight="700" fill="#102a43">TIME · 时间</text>
    <text x="130" y="574" transform="rotate(-90 130 574)" text-anchor="middle" font-size="25" font-weight="700" fill="#102a43">PERFORMANCE · 性能</text>
  </g>
</svg>

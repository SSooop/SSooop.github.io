<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Toyota-style Andon production status board</title>
  <desc id="desc">A clean reconstruction of an Andon board showing takt time, line status, efficiency, stop time, and pace maker indicators.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbe3e6"/>
      <stop offset="0.55" stop-color="#aeb9bd"/>
      <stop offset="1" stop-color="#7f8c91"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24323a"/>
      <stop offset="1" stop-color="#111a20"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#111a20" flood-opacity=".34"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <g opacity=".32" stroke="#eff3f4" stroke-width="18">
    <path d="M0 120h1600M0 260h1600M0 760h1600"/>
    <path d="M130 0l180 260M450 0l180 260M770 0l180 260M1090 0l180 260M1410 0l180 260"/>
  </g>
  <rect y="735" width="1600" height="165" fill="#8e999d"/>
  <path d="M0 810h1600" stroke="#f3cb45" stroke-width="16" opacity=".8"/>

  <g filter="url(#shadow)">
    <rect x="150" y="70" width="1300" height="700" rx="28" fill="url(#panel)" stroke="#5e6e76" stroke-width="8"/>
    <rect x="190" y="110" width="1220" height="620" rx="14" fill="#071015" stroke="#89969b" stroke-width="4"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="230" y="168" fill="#dbe3e6" font-size="32" font-weight="700" letter-spacing="4">ANDON · FINAL LINE</text>
    <text x="1315" y="164" fill="#91a1a8" font-size="22" text-anchor="end">LINE 01</text>

    <rect x="700" y="126" width="350" height="88" rx="10" fill="#17080a" stroke="#7d3037" stroke-width="3"/>
    <text x="875" y="186" fill="#ff4855" font-size="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" text-anchor="middle" filter="url(#glow)">00:00</text>

    <g transform="translate(230 250)">
      <rect width="1140" height="230" rx="12" fill="#e7ecee"/>
      <path d="M0 65h1140M0 148h1140M380 0v230M760 0v230" stroke="#819097" stroke-width="3"/>
      <g fill="#263640" font-size="26" font-weight="700" text-anchor="middle" letter-spacing="3">
        <text x="190" y="43">TRIM</text>
        <text x="570" y="43">CHASSIS</text>
        <text x="950" y="43">FINAL</text>
      </g>
      <g font-size="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" text-anchor="middle">
        <text x="95" y="119" fill="#1f7b55">01</text><text x="285" y="119" fill="#1f7b55">02</text>
        <text x="475" y="119" fill="#1f7b55">01</text><text x="665" y="119" fill="#d58e14">02</text>
        <text x="855" y="119" fill="#1f7b55">01</text><text x="1045" y="119" fill="#b9333d">02</text>
      </g>
      <g transform="translate(28 168)">
        <rect width="160" height="42" rx="7" fill="#22945f"/><text x="80" y="29" fill="white" font-size="20" font-weight="700" text-anchor="middle">RUNNING</text>
        <rect x="190" width="160" height="42" rx="7" fill="#22945f"/><text x="270" y="29" fill="white" font-size="20" font-weight="700" text-anchor="middle">RUNNING</text>
        <rect x="380" width="160" height="42" rx="7" fill="#22945f"/><text x="460" y="29" fill="white" font-size="20" font-weight="700" text-anchor="middle">RUNNING</text>
        <rect x="570" width="160" height="42" rx="7" fill="#e3a528"/><text x="650" y="29" fill="#172128" font-size="20" font-weight="700" text-anchor="middle">CALL</text>
        <rect x="760" width="160" height="42" rx="7" fill="#22945f"/><text x="840" y="29" fill="white" font-size="20" font-weight="700" text-anchor="middle">RUNNING</text>
        <rect x="950" width="160" height="42" rx="7" fill="#c73f49"/><text x="1030" y="29" fill="white" font-size="20" font-weight="700" text-anchor="middle">DELAY</text>
      </g>
    </g>

    <g transform="translate(230 520)">
      <text x="0" y="34" fill="#c6d0d4" font-size="24" font-weight="700" letter-spacing="2">EFFICIENCY</text>
      <text x="232" y="39" fill="#ff5460" font-size="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">89%</text>
      <text x="560" y="34" fill="#c6d0d4" font-size="24" font-weight="700" letter-spacing="2">TOTAL STOP TIME</text>
      <text x="900" y="39" fill="#ff5460" font-size="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">00:08:08</text>

      <rect y="78" width="1140" height="105" rx="12" fill="#dfe6e8"/>
      <text x="22" y="119" fill="#263640" font-size="24" font-weight="700" letter-spacing="2">PACE MAKER</text>
      <g transform="translate(220 94)" font-size="24" font-weight="700" text-anchor="middle">
        <g fill="#21865a">
          <rect width="72" height="70" rx="8"/><rect x="84" width="72" height="70" rx="8"/><rect x="168" width="72" height="70" rx="8"/>
          <rect x="252" width="72" height="70" rx="8"/><rect x="336" width="72" height="70" rx="8"/><rect x="420" width="72" height="70" rx="8"/>
        </g>
        <g fill="#e1a226">
          <rect x="504" width="72" height="70" rx="8"/><rect x="588" width="72" height="70" rx="8"/>
        </g>
        <g fill="#b93642">
          <rect x="672" width="72" height="70" rx="8"/><rect x="756" width="72" height="70" rx="8"/>
        </g>
        <g fill="white">
          <text x="36" y="46">1</text><text x="120" y="46">2</text><text x="204" y="46">3</text><text x="288" y="46">4</text>
          <text x="372" y="46">5</text><text x="456" y="46">6</text><text x="540" y="46">7</text><text x="624" y="46">8</text>
          <text x="708" y="46">9</text><text x="792" y="46">10</text>
        </g>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Knowledge construction system model</title>
  <desc id="desc">
    A redrawn i-System model connecting imagination, involvement, intelligence, integration, and
    intervention across knowledge management and systems thinking spaces.
  </desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#243447" flood-opacity=".12" />
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#526573" />
    </marker>
    <style>
      .eyebrow { font: 700 20px Inter, Arial, sans-serif; letter-spacing: 4px; fill: #6f7f89; }
      .title { font: 700 46px Georgia, "Times New Roman", serif; fill: #183247; }
      .subtitle { font: 400 22px Inter, Arial, sans-serif; fill: #657782; }
      .domain { font: 700 18px Inter, Arial, sans-serif; letter-spacing: 2.5px; fill: #6f7f89; }
      .node-title { font: 700 25px Inter, Arial, sans-serif; fill: #173047; }
      .node-copy { font: 400 18px Inter, Arial, sans-serif; fill: #526573; }
      .space { font: italic 700 22px Georgia, "Times New Roman", serif; fill: #385468; }
      .center { font: 700 24px Inter, Arial, sans-serif; letter-spacing: 2px; fill: #fff; }
      .center-copy { font: 400 16px Inter, Arial, sans-serif; fill: #dbe6eb; }
    </style>
  </defs>

  <rect width="1600" height="960" fill="#f5f1ea" />
  <circle cx="1420" cy="120" r="250" fill="#e7ecec" />
  <circle cx="100" cy="900" r="300" fill="#efe4dc" />

  <text x="100" y="92" class="eyebrow">KNOWLEDGE CONSTRUCTION SYSTEM</text>
  <text x="100" y="154" class="title">Holistic flexibility as a knowledge practice</text>
  <text x="100" y="185" class="subtitle">
    Five connected capabilities turn intuition, evidence, and social context into purposeful action.
  </text>

  <line x1="100" y1="543" x2="1500" y2="543" stroke="#9aa8af" stroke-width="2" stroke-dasharray="8 10" />
  <text x="1234" y="512" class="space">Knowledge management space</text>
  <text x="1258" y="580" class="space">Systems thinking space</text>

  <path d="M505 366L690 255" fill="none" stroke="#526573" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M890 255L1075 366" fill="none" stroke="#526573" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M1032 405L560 405" fill="none" stroke="#526573" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M488 438L568 615" fill="none" stroke="#526573" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M1112 438L1032 615" fill="none" stroke="#526573" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M742 286L650 608" fill="none" stroke="#526573" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M858 286L950 608" fill="none" stroke="#526573" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M720 690L880 690" fill="none" stroke="#526573" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M930 638L544 454" fill="none" stroke="#7d8d96" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#arrow)" />
  <path d="M670 638L1056 454" fill="none" stroke="#7d8d96" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="280" y="298" width="300" height="160" rx="28" fill="#fff" stroke="#d9c4b6" stroke-width="2" />
    <circle cx="330" cy="347" r="20" fill="#d87f63" />
    <text x="368" y="355" class="node-title">Imagination</text>
    <text x="330" y="398" class="node-copy">Generate new ideas</text>
    <text x="330" y="427" class="node-copy">from intuition and judgment</text>
  </g>
  <text x="280" y="276" class="domain">COGNITIVE · MENTAL DOMAIN</text>

  <g filter="url(#shadow)">
    <rect x="650" y="238" width="300" height="148" rx="28" fill="#fff" stroke="#c4d2ca" stroke-width="2" />
    <circle cx="700" cy="286" r="20" fill="#5d8b78" />
    <text x="738" y="294" class="node-title">Involvement</text>
    <text x="700" y="336" class="node-copy">Collect social knowledge</text>
    <text x="700" y="363" class="node-copy">through participation</text>
  </g>
  <text x="650" y="220" class="domain">SOCIAL · RELATIONAL DOMAIN</text>

  <g filter="url(#shadow)">
    <rect x="1020" y="298" width="300" height="160" rx="28" fill="#fff" stroke="#b9ccd9" stroke-width="2" />
    <circle cx="1070" cy="347" r="20" fill="#4f7f9b" />
    <text x="1108" y="355" class="node-title">Intelligence</text>
    <text x="1070" y="398" class="node-copy">Organize evidence</text>
    <text x="1070" y="427" class="node-copy">into rational knowledge</text>
  </g>
  <text x="1020" y="276" class="domain">SCIENTIFIC · ACTUAL DOMAIN</text>

  <g filter="url(#shadow)">
    <rect x="480" y="610" width="300" height="160" rx="28" fill="#fff" stroke="#d7c8a6" stroke-width="2" />
    <circle cx="530" cy="659" r="20" fill="#c79a42" />
    <text x="568" y="667" class="node-title">Integration</text>
    <text x="530" y="710" class="node-copy">Construct a coherent whole</text>
    <text x="530" y="739" class="node-copy">from distributed knowledge</text>
  </g>
  <text x="480" y="802" class="domain">KNOWLEDGE CONSTRUCTION</text>

  <g filter="url(#shadow)">
    <rect x="820" y="610" width="300" height="160" rx="28" fill="#fff" stroke="#bfcbd0" stroke-width="2" />
    <circle cx="870" cy="659" r="20" fill="#536f80" />
    <text x="908" y="667" class="node-title">Intervention</text>
    <text x="870" y="710" class="node-copy">Translate strategy into action</text>
    <text x="870" y="739" class="node-copy">and reshape the system</text>
  </g>
  <text x="900" y="802" class="domain">PURPOSEFUL ACTION</text>

  <g filter="url(#shadow)">
    <circle cx="800" cy="470" r="78" fill="#183247" />
    <text x="800" y="463" text-anchor="middle" class="center">i-SYSTEM</text>
    <text x="800" y="493" text-anchor="middle" class="center-copy">knowledge in motion</text>
  </g>

  <text x="100" y="900" class="subtitle">
    Simplified redraw based on Yoshiteru Nakamori’s knowledge construction system model.
  </text>
</svg>

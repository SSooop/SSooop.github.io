<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Neo-2/15 and human IL-2 sequence comparison</title>
  <desc id="desc">A clean sequence comparison showing the 100 amino acid de novo Neo-2/15 parent scaffold and the 153 amino acid human prepro-IL-2 sequence.</desc>
  <rect width="1600" height="760" fill="#f5f1ea"/>
  <rect x="44" y="42" width="1512" height="676" rx="28" fill="#fffdf9" stroke="#d8cec2" stroke-width="2"/>

  <text x="92" y="105" fill="#142b40" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">A de novo scaffold, not an IL-2 edit</text>
  <text x="92" y="145" fill="#617388" font-family="Inter, Arial, sans-serif" font-size="22">Neo-2/15 parent scaffold versus human prepro-IL-2</text>

  <g transform="translate(92 192)">
    <rect width="1416" height="198" rx="20" fill="#eef4f7" stroke="#c7d5de"/>
    <rect x="24" y="24" width="178" height="46" rx="23" fill="#173a54"/>
    <text x="113" y="55" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Neo-2/15</text>
    <text x="230" y="55" fill="#4e6678" font-family="Inter, Arial, sans-serif" font-size="20">100 aa · designed four-helix protein core</text>
    <text x="24" y="106" fill="#20384c" font-family="'SFMono-Regular', Consolas, monospace" font-size="25" letter-spacing="1.15">PKKKIQLHAE HALYDALMIL NIVKTNSPPA EEKLEDYAFN FELILEEIAR</text>
    <text x="24" y="151" fill="#20384c" font-family="'SFMono-Regular', Consolas, monospace" font-size="25" letter-spacing="1.15">LFESGDQKDE AEKAKRMKEW MKRIKTTASE DEQEEMANAI ITILQSWIFS</text>
    <text x="1115" y="174" fill="#ba6248" font-family="Inter, Arial, sans-serif" font-size="17">NL-201: one engineered Cys + 40 kDa PEG</text>
  </g>

  <g transform="translate(92 414)">
    <rect width="1416" height="212" rx="20" fill="#f6f1ee" stroke="#dbcfc8"/>
    <rect x="24" y="24" width="178" height="46" rx="23" fill="#a44f43"/>
    <text x="113" y="55" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Human IL-2</text>
    <text x="230" y="55" fill="#6d625d" font-family="Inter, Arial, sans-serif" font-size="20">153 aa · native precursor including signal peptide</text>
    <text x="24" y="106" fill="#443a36" font-family="'SFMono-Regular', Consolas, monospace" font-size="23" letter-spacing="0.92">MYRMQLLSCI ALSLALVTNS APTSSSTKKT QLQLEHLLLD LQMILNGINN YKNPKLTRML</text>
    <text x="24" y="148" fill="#443a36" font-family="'SFMono-Regular', Consolas, monospace" font-size="23" letter-spacing="0.92">TFKFYMPKKA TELKHLQCLE EELKPLEEVL NLAQSKNFHL RPRDLISNIN VIVLELKGSE</text>
    <text x="24" y="190" fill="#443a36" font-family="'SFMono-Regular', Consolas, monospace" font-size="23" letter-spacing="0.92">TTFMCEYADE TATIVEFLNR WITFCQSIISTLT</text>
  </g>

  <g transform="translate(92 660)">
    <rect width="242" height="36" rx="18" fill="#d9e6e9"/>
    <text x="121" y="25" text-anchor="middle" fill="#173a54" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">14% sequence identity</text>
    <rect x="258" width="292" height="36" rx="18" fill="#eaded7"/>
    <text x="404" y="25" text-anchor="middle" fill="#7b463d" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">29% structure-based identity</text>
    <text x="1416" y="25" text-anchor="end" fill="#81766e" font-family="Inter, Arial, sans-serif" font-size="15">Silva et al., Nature 565, 186–191 (2019); US20200339648A1</text>
  </g>
</svg>

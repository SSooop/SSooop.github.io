<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Business logic, data, and algorithms semantic loop</title>
  <desc id="desc">
    Business logic maps into governed semantic data, data supplies model training, and algorithms return business feedback for continuous iteration.
  </desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf9f6"/>
      <stop offset="1" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#356b9b"/>
      <stop offset="1" stop-color="#4b88b8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f8d73"/>
      <stop offset="1" stop-color="#55ad8e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7453a6"/>
      <stop offset="1" stop-color="#9470bd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1a2a3d" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#425269"/>
    </marker>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#7d8998"/>
    </marker>
  </defs>

  <rect width="1600" height="760" rx="40" fill="url(#bg)"/>
  <circle cx="1460" cy="80" r="240" fill="#7453a6" opacity=".045"/>
  <circle cx="110" cy="700" r="250" fill="#356b9b" opacity=".045"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="110" y="100" fill="#18283c" font-size="26" font-weight="750" letter-spacing="4">THE ENTERPRISE INTELLIGENCE LOOP</text>
    <text x="110" y="140" fill="#687589" font-size="21">Business reality becomes semantic data, then executable intelligence</text>

    <g filter="url(#shadow)">
      <rect x="110" y="245" width="360" height="245" rx="28" fill="#fff"/>
      <rect x="620" y="210" width="360" height="280" rx="28" fill="#fff"/>
      <rect x="1130" y="245" width="360" height="245" rx="28" fill="#fff"/>
    </g>
    <rect x="110" y="245" width="12" height="245" rx="6" fill="url(#blue)"/>
    <rect x="620" y="210" width="12" height="280" rx="6" fill="url(#green)"/>
    <rect x="1130" y="245" width="12" height="245" rx="6" fill="url(#purple)"/>

    <g transform="translate(170 292)">
      <circle cx="42" cy="42" r="42" fill="#e8f1f8"/>
      <path d="M22 48h40M27 36h30M32 24h20M27 60h30" fill="none" stroke="#3e79aa" stroke-width="5" stroke-linecap="round"/>
      <text x="105" y="32" fill="#24415d" font-size="34" font-weight="780">Business Logic</text>
      <text x="105" y="68" fill="#356b9b" font-size="24" font-weight="700">业务逻辑</text>
      <text x="0" y="138" fill="#5f6b7b" font-size="22">Enterprise ontology</text>
      <text x="0" y="174" fill="#7c8795" font-size="19">People · processes · instruments</text>
      <text x="0" y="206" fill="#7c8795" font-size="19">企业业务本体</text>
    </g>

    <g transform="translate(680 260)">
      <circle cx="42" cy="42" r="42" fill="#e5f3ed"/>
      <ellipse cx="42" cy="27" rx="23" ry="10" fill="none" stroke="#368e74" stroke-width="4"/>
      <path d="M19 27v32c0 6 10 11 23 11s23-5 23-11V27M19 43c0 6 10 11 23 11s23-5 23-11" fill="none" stroke="#368e74" stroke-width="4"/>
      <text x="105" y="32" fill="#245c4e" font-size="34" font-weight="780">Data</text>
      <text x="105" y="68" fill="#2f8d73" font-size="24" font-weight="700">数据</text>
      <text x="0" y="150" fill="#5f6b7b" font-size="22">Semantic annotation &amp; governance</text>
      <text x="0" y="186" fill="#7c8795" font-size="19">Context · lineage · quality · meaning</text>
      <text x="0" y="222" fill="#7c8795" font-size="19">语义标注与治理</text>
    </g>

    <g transform="translate(1190 292)">
      <circle cx="42" cy="42" r="42" fill="#eee9f6"/>
      <path d="M22 42h40M42 22v40M28 28l28 28M56 28 28 56" fill="none" stroke="#7d5aab" stroke-width="4" stroke-linecap="round"/>
      <circle cx="42" cy="42" r="8" fill="#7d5aab"/>
      <text x="105" y="32" fill="#503a6d" font-size="34" font-weight="780">Algorithms</text>
      <text x="105" y="68" fill="#7453a6" font-size="24" font-weight="700">算法</text>
      <text x="0" y="138" fill="#5f6b7b" font-size="22">AI model training &amp; application</text>
      <text x="0" y="174" fill="#7c8795" font-size="19">Models · software · decision systems</text>
      <text x="0" y="206" fill="#7c8795" font-size="19">AI模型训练与应用</text>
    </g>

    <g fill="none" stroke="#425269" stroke-width="4" marker-end="url(#arrow)">
      <path d="M470 350H605"/>
      <path d="M980 350H1115"/>
    </g>
    <g fill="#536176" font-size="18" font-weight="700">
      <text x="493" y="318">Semantic mapping</text>
      <text x="512" y="388">语义映射</text>
      <text x="1000" y="318">Training data</text>
      <text x="1018" y="388">提供训练数据</text>
    </g>

    <path d="M1310 515 C1300 650 300 650 290 515" fill="none" stroke="#7d8998" stroke-width="4" marker-end="url(#arrowLight)"/>
    <rect x="565" y="582" width="470" height="58" rx="29" fill="#fff" stroke="#d5dbe2" stroke-width="2"/>
    <text x="800" y="607" text-anchor="middle" fill="#536176" font-size="18" font-weight="750">Business feedback &amp; model iteration</text>
    <text x="800" y="631" text-anchor="middle" fill="#7b8695" font-size="16">业务反馈与模型迭代</text>

    <g transform="translate(110 690)">
      <rect width="1380" height="2" fill="#d2d8df"/>
      <circle cx="0" cy="1" r="7" fill="#3f7dac"/>
      <circle cx="690" cy="1" r="7" fill="#43a182"/>
      <circle cx="1380" cy="1" r="7" fill="#8260ad"/>
    </g>
  </g>
</svg>

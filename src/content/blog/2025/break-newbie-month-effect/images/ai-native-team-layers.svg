<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ontology, Epistemology, and Methodology layers of an AI-native team</title>
  <desc id="desc">
    Three connected layers show how shared data and semantics support collective reasoning, which in turn supports reusable workflows and decisions.
  </desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7f3"/>
      <stop offset="1" stop-color="#eef1f5"/>
    </linearGradient>
    <linearGradient id="ontology" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#264f88"/>
      <stop offset="1" stop-color="#3f70ad"/>
    </linearGradient>
    <linearGradient id="epistemology" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bf6b1d"/>
      <stop offset="1" stop-color="#df9a47"/>
    </linearGradient>
    <linearGradient id="methodology" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ad354e"/>
      <stop offset="1" stop-color="#d35a6c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#142238" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#627084"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="40" fill="url(#background)"/>
  <circle cx="1460" cy="110" r="220" fill="#456aa2" opacity=".05"/>
  <circle cx="130" cy="820" r="260" fill="#c95062" opacity=".045"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="140" y="118" fill="#16263d" font-size="28" font-weight="700" letter-spacing="5">AI-NATIVE TEAM STACK</text>
    <text x="140" y="164" fill="#667286" font-size="23">From shared reality to repeatable action</text>

    <g filter="url(#shadow)">
      <path d="M250 605 H1255 L1365 760 H140 L250 605 Z" fill="url(#ontology)"/>
      <path d="M315 382 H1190 L1300 537 H205 L315 382 Z" fill="url(#epistemology)"/>
      <path d="M380 159 H1125 L1235 314 H270 L380 159 Z" fill="url(#methodology)"/>
    </g>

    <g fill="#fff">
      <text x="325" y="678" font-size="46" font-weight="750">Ontology</text>
      <text x="325" y="721" font-size="24" opacity=".88">Shared entities · data · semantics</text>

      <text x="390" y="455" font-size="46" font-weight="750">Epistemology</text>
      <text x="390" y="498" font-size="24" opacity=".88">Rules · models · collective reasoning</text>

      <text x="455" y="232" font-size="46" font-weight="750">Methodology</text>
      <text x="455" y="275" font-size="24" opacity=".88">Reusable workflows · decisions · learning</text>
    </g>

    <g fill="none" stroke="#627084" stroke-width="3" marker-end="url(#arrow)">
      <path d="M1450 704 C1510 650 1510 548 1448 495"/>
      <path d="M1448 480 C1510 427 1510 325 1448 272"/>
    </g>
    <g fill="#627084" font-size="18" font-weight="700" letter-spacing="2">
      <text x="1425" y="592" transform="rotate(-90 1425 592)">ABSTRACTION</text>
    </g>

    <g fill="none" stroke="#9aa4b2" stroke-width="2.5" stroke-dasharray="8 10" marker-end="url(#arrow)">
      <path d="M1215 350 C1310 375 1350 410 1375 460"/>
      <path d="M1280 570 C1360 600 1390 630 1400 672"/>
    </g>
    <text x="1228" y="392" fill="#7d8795" font-size="18" font-weight="650" letter-spacing="1.5">FEEDBACK</text>

    <g transform="translate(145 805)">
      <rect width="1310" height="2" fill="#cfd5dc"/>
      <circle cx="0" cy="1" r="7" fill="#456aa2"/>
      <circle cx="655" cy="1" r="7" fill="#d58a3a"/>
      <circle cx="1310" cy="1" r="7" fill="#c95062"/>
      <text x="0" y="48" fill="#6d7786" font-size="17" font-weight="650">REALITY</text>
      <text x="610" y="48" fill="#6d7786" font-size="17" font-weight="650">KNOWLEDGE</text>
      <text x="1215" y="48" fill="#6d7786" font-size="17" font-weight="650">ACTION</text>
    </g>
  </g>
</svg>
